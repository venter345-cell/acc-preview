<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1E1C"/>
      <stop offset="100%" stop-color="#143830"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" stroke="url(#mint)" stroke-width="12"/>
  
  <!-- Center Brand Symbol: Stylized Medical Cross + Aviation Wing -->
  <g transform="translate(256, 256)">
    <!-- Aviation Wing Arc -->
    <path d="M -160 30 Q 0 -90 160 30 Q 0 -40 -160 30 Z" fill="url(#mint)"/>
    <!-- Medical Cross Vertical -->
    <rect x="-24" y="-120" width="48" height="240" rx="12" fill="url(#mint)"/>
    <!-- Medical Cross Horizontal -->
    <rect x="-120" y="-24" width="240" height="48" rx="12" fill="url(#mint)"/>
    <!-- Core Accent -->
    <circle cx="0" cy="0" r="18" fill="#FFFFFF"/>
  </g>
</svg>
